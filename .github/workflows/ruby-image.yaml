name: Ruby image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ruby_image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install native build tools and Bazelisk
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libssl-dev
          curl -fsSLo bazelisk "https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-${{ matrix.arch }}"
          chmod +x bazelisk
      - name: Build and load the native Ruby image
        run: ./bazelisk run //src/apis/examples/ruby:get_widgets_example_image
      - name: Verify offline startup and native gems
        run: bash .github/ruby-image-smoke.sh
